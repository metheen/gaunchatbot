name: CI

# Her push ve PR'da lint (ruff) + testleri (pytest) otomatik koşar.
# Testler harici servis GEREKTİRMEZ (qdrant/mariadb/ollama mock'lanır); yalnız
# Config() MARIADB_PASSWORD beklediği için sahte bir değer verilir.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      MARIADB_PASSWORD: ci-dummy   # Config() boş şifrede SystemExit eder
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q -p no:cacheprovider
