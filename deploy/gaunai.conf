# GaunAI - Nginx reverse proxy (80 -> 127.0.0.1:8000)
# /etc/nginx/sites-available/gaunai.conf

server {
    listen 80;
    listen [::]:80;

    # ---- SUNUCUYA GORE UYARLA: alan adi veya sunucu IP'si ----
    server_name gaunai.gaziantep.edu.tr;
    # ----------------------------------------------------------

    # Sohbet istekleri kucuk JSON; makul govde siniri.
    client_max_body_size 2m;

    # Erisim/hata loglari
    access_log /var/log/nginx/gaunai_access.log;
    error_log  /var/log/nginx/gaunai_error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Gercek istemci bilgisi backend'e tasinir
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ==== KRITIK: LLM + vektor aramasi 15-20 sn surebilir ====
        # Varsayilan 60 sn'de Nginx '504 Gateway Timeout' verir; uzatiyoruz.
        proxy_connect_timeout 120s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;

        # Uzun/akan yanitlar aninda gecsin (tamponlama kapali)
        proxy_buffering off;
    }
}
